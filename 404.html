
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Matrix Path Unresolved</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CREATIVE BACKGROUND MATRIX CANVAS ELEMENTS -->
    <div class="lost-vector-bg">
        <div class="radar-scan-line"></div>
        <div class="grid-cross-accent position-a">+</div>
        <div class="grid-cross-accent position-b">+</div>
    </div>

    <!-- CENTRAL CONTENT CONSOLE CHASSIS -->
    <main class="error-console-frame">
        
        <!-- LARGE GRAPHIC FOCAL LAYER -->
        <div class="error-code-container">
            <h1 class="error-huge-digits">404</h1>
            <div class="error-vignette-shadow"></div>
        </div>

        <!-- TYPOGRAPHY METRICS NARRATIVE MAP -->
        <div class="error-text-deck">
            <h2>Matrix Path Unresolved</h2>
            <p>The targeted sub-index node link has been unmapped or moved out of range to protect remote basecamp server data coordinates. Connection offline.</p>
        </div>

        <!-- ACTION BUTTON TRIGGER TRACK (DUAL CAPSULE NAVIGATION) -->
        <div class="error-buttons-track">
            
            <!-- BUTTON 1: Back to Precise Source Section Anchor -->
            <button class="btn-error-action btn-outline" id="errorBtnReturnPrevious">
                <svg class="btn-vector-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                <span>Return to Section</span>
            </button>

            <!-- BUTTON 2: Home Index Redirection Pointer -->
            <a href="index.html" class="btn-error-action btn-solid">
                <svg class="btn-vector-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>Basecamp Home</span>
            </a>

        </div>

    </main>

    <style>
        /* --- High-Contrast Luxury Monochromatic 404 Arena Design System --- */
body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #0d131a; /* Deep Stackly Obsidian Black canvas */
    color: #ffffff;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* ========================================================
   CREATIVE BACKGROUND MATRIX CANVAS LAYERS
   ======================================================== */
.lost-vector-bg {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 1;
    background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 30px 30px; /* Monochromatic tactical radar mesh pattern */
}

.radar-scan-line {
    position: absolute;
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, transparent, #ff4b2b, transparent); /* Electric Coral ray flare */
    opacity: 0.15;
    top: 0;
    animation: radarSweep 6s infinite linear;
}

.grid-cross-accent {
    position: absolute;
    font-family: monospace;
    font-size: 1.2rem;
    color: #a832ff; /* Solar Violet coordinates marker */
    opacity: 0.2;
}
.position-a { top: 20%; left: 15%; }
.position-b { bottom: 25%; right: 18%; }

@keyframes radarSweep {
    0% { top: 0%; opacity: 0; }
    10% { opacity: 0.3; }
    90% { opacity: 0.3; }
    100% { top: 100%; opacity: 0; }
}

/* ========================================================
   CENTRAL ERROR CONSOLE FRAME CHASSIS
   ======================================================== */
.error-console-frame {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 580px;
    padding: 2rem;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

/* 404 Large Focal Text Digits */
.error-code-container {
    position: relative;
    margin-bottom: 1rem;
}

.error-huge-digits {
    font-size: clamp(6.5rem, 16vw, 10.5rem);
    font-weight: 900;
    color: #ff4b2b; /* Focal Stackly Coral Digits */
    margin: 0;
    letter-spacing: -4px;
    line-height: 0.95;
    background: linear-gradient(180deg, #ff4b2b 0%, #a832ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 15px 30px rgba(255, 75, 43, 0.15));
    animation: textGitchPulse 4s infinite ease-in-out;
}

@keyframes textGitchPulse {
    0%, 100% { transform: scale(1); filter: saturate(1); }
    50% { transform: scale(1.02); filter: saturate(1.2); }
}

/* Narrative Copy Deck Info */
.error-text-deck h2 {
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    font-weight: 800;
    letter-spacing: -1px;
    margin: 0 0 1rem 0;
}

.error-text-deck p {
    font-size: clamp(0.95rem, 1.8vw, 1.1rem);
    font-weight: 600;
    color: #cbd5e1;
    opacity: 0.65;
    line-height: 1.6;
    max-width: 480px;
    margin: 0 0 3.5rem 0;
}

/* ========================================================
   ACTION BUTTON TRACK (DUAL CAPSULE MODES)
   ======================================================== */
.error-buttons-track {
    display: flex;
    gap: 1.5rem;
    width: 100%;
    justify-content: center;
}

.btn-error-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    height: 52px;
    padding: 0 2.2rem;
    font-size: 1rem;
    font-weight: 800;
    border-radius: 50px; /* Perfect circular pill tracks capsule form */
    cursor: pointer;
    text-decoration: none;
    box-sizing: border-box;
    white-space: nowrap;
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease, background-color 0.25s ease, color 0.25s ease;
}

.btn-vector-icon {
    width: 18px;
    height: 18px;
}

/* Variant A: Return to Section Outline Button */
.btn-outline {
    background-color: transparent;
    color: #ffffff;
    border: 2px solid #ffffff;
}

.btn-outline:hover {
    background-color: #ffffff;
    color: #0d131a;
    transform: translateY(-3px);
}

/* Variant B: Home Basecamp Solid Button */
.btn-solid {
    background: linear-gradient(90deg, #ff4c2b 0%, #d83490 45%, #943bf1 100%); /* Stackly Signature Gradient */
    color: #ffffff;
    border: none;
    box-shadow: 0 8px 20px rgba(216, 52, 144, 0.25);
}

.btn-solid:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 12px 25px rgba(216, 52, 144, 0.4);
}

/* ========================================================
   RESPONSIVE DESIGN VIEWPORT COLLAPSE BREAKS
   ======================================================== */
@media (max-width: 550px) {
    .error-buttons-track {
        flex-direction: column; /* Stack actions buttons vertically on mobile panels layouts */
        gap: 1rem;
        width: 100%;
        max-width: 290px;
    }
    .btn-error-action {
        width: 100%;
    }
}

    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

    const returnSectionBtn = document.getElementById('errorBtnReturnPrevious');

    if (returnSectionBtn) {
        returnSectionBtn.addEventListener('click', (e) => {
            e.preventDefault();

            // Native Session Validation: Inspect browser history tracking stack
            if (document.referrer) {
                // Returns user directly to previous source page URL accompanied with its anchored hash value tag loop
                window.location.href = document.referrer;
            } else {
                // Safe fallback contingency loop: if arrivals stack entry clears, safely slide back via historical window layers
                window.history.back();
            }
        });
    }

});

    </script>
</body>
</html>
