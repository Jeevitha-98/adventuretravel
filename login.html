<!-- Fully Responsive High-Contrast Adventure Gateway Login Portal -->
<section id="vault-auth-container" class="auth-viewport-arena">
    <div class="auth-central-chassis">
        
        <!-- HEADER TOP ACTION BAR ROW -->
        <div class="auth-top-nav-row">
            <span class="vault-meta-tag">— COMMAND TERMINAL —</span>
       <button class="btn-terminal-back fallback-redirect"
        id="vaultHomeBtn"
        onclick="window.location.href='index.html'">
    ← BASECAMP
</button>
        </div>

        <!-- MAIN GREETING PACK BLOCK -->
        <div class="auth-greeting-header">
            <h1 class="auth-main-title">Welcome <span>Back.</span></h1>
            <p class="auth-subtitle">Select your operational role parameters to unlock your custom project registry dashboard.</p>
        </div>

        <!-- AUTH VALIDATION ENTRY SYSTEM FORM -->
        <form id="vaultSecureLoginForm" class="auth-matrix-form" novalidate>
            
            <!-- ROLE SELECTOR BLOCKS ROW GRID -->
            <div class="role-selector-matrix-row">
                <!-- Option A: Atelier Owner (Default Active Baseline) -->
                <div class="role-card-wrapper active" data-role="partner" id="rolePartner">
                    <div class="role-icon-node">👑</div>
                    <div class="role-meta-text">
                        <span class="role-title-head">Atelier Owner</span>
                        <p class="role-sub-desc">STUDIO DASHBOARD</p>
                    </div>
                </div>

                <!-- Option B: Private Client -->
                <div class="role-card-wrapper" data-role="client" id="roleClient">
                    <div class="role-icon-node">🧳</div>
                    <div class="role-meta-text">
                        <span class="role-title-head">Private Client</span>
                        <p class="role-sub-desc">REGISTRY DECK</p>
                    </div>
                </div>
            </div>

            <!-- DATA ROW 1: Email Box Slot -->
            <div class="auth-input-node-field">
                <label for="vaultUserEmail">EMAIL ADDRESS</label>
                <div class="auth-input-wrapper-box">
                    <input type="email" id="vaultUserEmail" placeholder="name@example.com" required>
                </div>
            </div>

            <!-- DATA ROW 2: Password Key Slot -->
            <div class="auth-input-node-field">
                <label for="vaultUserKey">SECURITY PASSWORD KEY</label>
                <div class="auth-input-wrapper-box">
                    <input type="password" id="vaultUserKey" placeholder="••••••••" required>
                    <span class="eye-toggle-vector" id="togglePasswordVisibility">👁️</span>
                </div>
            </div>

            <!-- UTILITY CHECKLIST METADATA ROW LINK LINES -->
            <div class="auth-utilities-line-row">
                <label class="remember-me-checkbox-label">
                    <input type="checkbox" id="rememberMeToggle">
                    <span>Remember me</span>
                </label>
           <a href="404.html" class="auth-utility-forget-link">
    Forgot Password?
</a>
            </div>

            <!-- CORE PRIMARY SUBMIT TRANSMISSION PILL BUTTON -->
            <div class="auth-action-submit-node">
                <button type="submit" class="btn-auth-launch-sequence">LOG IN SECURELY →</button>
            </div>

        </form>

        <!-- DIVIDER BREAK RIBBON TRACK -->
        <div class="auth-or-divider-ribbon">
            <span>OR SIGN IN WITH</span>
        </div>

        <!-- SOCIAL OUTSOURCED GATEWAYS ROW GRID -->
        <div class="auth-social-gateways-stack">
           <a href="404.html" class="social-gateway-pill-btn">
    <span class="social-brand-letter">G</span> Google
</a>
          <a href="404.html" class="social-gateway-pill-btn">
    <span class="social-brand-letter">F</span> Facebook
</a>
        </div>

        <!-- FOOTER TRANSITION BLOCK NODES LINK ROWS -->
        <div class="auth-footer-routing-box">
            <p>Don't have an account? <button type="button" class="auth-register-link-trigger fallback-redirect"
    onclick="window.location.href='signup.html'">
    Create Account
</button></p>
        </div>

    </div>
</section>

</style>

<script>
    document.addEventListener('DOMContentLoaded', () => {

    // Target active login page parameters variables
    const loginForm = document.getElementById('vaultSecureLoginForm');
    const userEmailInput = document.getElementById('vaultUserEmail');
    const userKeyInput = document.getElementById('vaultUserKey');
    const toggleEye = document.getElementById('togglePasswordVisibility');
    
    const rolePartner = document.getElementById('rolePartner');
    const roleClient = document.getElementById('roleClient');
    let dynamicActiveRole = 'partner'; // Tracks row selection states: partner or client

    // ========================================================
    // 1. DYNAMIC INTERACTIVE ROLE CARD SELECTION TOGGLES
    // ========================================================
    if (rolePartner && roleClient) {
        rolePartner.addEventListener('click', () => {
            roleClient.classList.remove('active');
            rolePartner.classList.add('active');
            dynamicActiveRole = 'partner';
        });

        roleClient.addEventListener('click', () => {
            rolePartner.classList.remove('active');
            roleClient.classList.add('active');
            dynamicActiveRole = 'client';
        });
    }

    // ========================================================
    // 2. PASSWORD VISIBILITY KEY EYE TOGGLE MASKING
    // ========================================================
    if (toggleEye && userKeyInput) {
        toggleEye.addEventListener('click', () => {
            const isMaskedType = userKeyInput.getAttribute('type') === 'password';
            userKeyInput.setAttribute('type', isMaskedType ? 'text' : 'password');
            toggleEye.textContent = isMaskedType ? '🙈' : '👁️';
        });
    }

    // ========================================================
    // 3. SECURE LOCALSTORAGE CACHE COMMIT & REDIRECT PIPELINE
    // ========================================================
    if (loginForm) {
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const emailValue = userEmailInput.value.trim();
            const keyValue = userKeyInput.value.trim();

            // Enforces strict "Please fill the fields" warning alerts prior to route submission
            if (!emailValue || !keyValue) {
                alert('Please fill out all input fields before attempting log in sequence.');
                return;
            }

            // Commit input email handle to browser cache storage bucket for header retrieval
            localStorage.setItem('activeExplorerEmail', emailValue);

            // Redirect smoothly based on current selection index parameter card track
            if (dynamicActiveRole === 'partner') {
                window.location.href = 'partner-dashboard.html';
            } else if (dynamicActiveRole === 'client') {
                window.location.href = 'client-dashboard.html';
            }
        });
    }

    // ========================================================
    // 4. SECURE 404 COCKPIT OVERLAY INTERCEPTOR ROUTER
    // ========================================================
      if (loginForm) {
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const emailValue = userEmailInput.value.trim();
            const keyValue = userKeyInput.value.trim();

            if (!emailValue || !keyValue) {
                alert('Please fill out all input fields before attempting log in sequence.');
                return;
            }

            localStorage.setItem('activeExplorerEmail', emailValue);

            if (dynamicActiveRole === 'partner') {
                window.location.href = 'partner-dashboard.html';
            } else if (dynamicActiveRole === 'client') {
                window.location.href = 'client-dashboard.html';
            }
        });
    }

});


</script>
